<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Support</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header>
    <h1>Customer Support Portal</h1>
    <small>Chat with AI support, view orders, and check subscription status.</small>
  </header>

  <div class="container grid-2">
    <section class="card">
      <h2>Support Chat</h2>
      <div class="row" style="margin-bottom: 0.75rem;">
        <input id="customerId" type="number" placeholder="Customer ID" value="1" />
        <button class="secondary" onclick="loadCustomerData()">Load Data</button>
      </div>
      <div id="chatBox" class="chat-box"></div>
      <div class="row" style="margin-top: 0.75rem;">
        <input id="messageInput" placeholder="Type your message..." />
        <button onclick="sendMessage()">Send</button>
      </div>
      <p class="muted" id="chatMeta"></p>
    </section>

    <section class="card">
      <h2>Subscription</h2>
      <div id="subscriptionPanel" class="muted">Load customer data to view subscription.</div>
      <h3 style="margin-top: 1rem;">Recent Support History</h3>
      <div id="historyPanel" class="muted">No history loaded.</div>
    </section>

    <section class="card" style="grid-column: 1 / -1;">
      <h2>Orders</h2>
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Product</th>
            <th>Status</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </section>
  </div>

<script>
let conversationId = null;

function addMessage(role, content) {
  const chatBox = document.getElementById('chatBox');
  const row = document.createElement('div');
  row.className = 'msg';
  row.innerHTML = `<strong>${role}:</strong> <span>${content}</span>`;
  chatBox.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function loadCustomerData() {
  const customerId = Number(document.getElementById('customerId').value);
  if (!customerId) return;

  const [ordersRes, subRes, historyRes] = await Promise.all([
    fetch(`/api/customer/${customerId}/orders`),
    fetch(`/api/customer/${customerId}/subscription`),
    fetch(`/api/customer/${customerId}/history?limit=10`),
  ]);

  const ordersJson = await ordersRes.json();
  const subJson = await subRes.json();
  const historyJson = await historyRes.json();

  const body = document.getElementById('ordersBody');
  body.innerHTML = '';
  (ordersJson.orders || []).forEach(order => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${order.id}</td><td>${order.product_name}</td><td><span class='badge'>${order.order_status}</span></td><td>$${order.total}</td>`;
    body.appendChild(tr);
  });

  const sub = subJson.subscription;
  document.getElementById('subscriptionPanel').innerHTML = `
    <p><strong>Name:</strong> ${sub.full_name}</p>
    <p><strong>Email:</strong> ${sub.email}</p>
    <p><strong>Tier:</strong> <span class="badge">${sub.subscription_plan}</span></p>
    <p><strong>Account:</strong> ${sub.account_status}</p>
  `;

  const historyPanel = document.getElementById('historyPanel');
  historyPanel.innerHTML = (historyJson.history || [])
    .map(item => `<p><strong>${item.role}</strong>: ${item.content}</p>`)
    .join('') || 'No recent support messages.';
}

async function sendMessage() {
  const customerId = Number(document.getElementById('customerId').value);
  const messageInput = document.getElementById('messageInput');
  const message = messageInput.value.trim();
  if (!customerId || !message) return;

  addMessage('Customer', message);
  messageInput.value = '';

  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ customer_id: customerId, message, conversation_id: conversationId }),
  });

  const payload = await response.json();
  conversationId = payload.conversation_id;
  addMessage('Agent', payload.agent_response || '(No response)');

  document.getElementById('chatMeta').textContent =
    `Route: ${payload.selected_route} | Agent: ${payload.assigned_agent} | Status: ${payload.status}` +
    (payload.handoff_note ? ` | ${payload.handoff_note}` : '');

  await loadCustomerData();
}

window.addEventListener('DOMContentLoaded', loadCustomerData);
</script>
</body>
</html>
